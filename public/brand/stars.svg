    <circle cx="50" cy="360" r="1" />
    <circle cx="100" cy="390" r="1" />
    <circle cx="150" cy="370" r="1" />
    <circle cx="200" cy="380" r="1" />
    <circle cx="250" cy="360" r="1" />
    <circle cx="300" cy="390" r="1" />
