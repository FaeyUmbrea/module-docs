    <circle cx="340" cy="120" r="1" />
    <circle cx="390" cy="160" r="1" />

    <circle cx="40" cy="200" r="1" />
    <circle cx="90" cy="230" r="1" />
    <circle cx="130" cy="210" r="1" />
    <circle cx="180" cy="240" r="1" />
    <circle cx="230" cy="200" r="1" />
    <circle cx="280" cy="230" r="1" />
