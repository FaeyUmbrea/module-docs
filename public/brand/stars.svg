    <circle cx="180" cy="100" r="2" fill="#FF0000" />
    <circle cx="180" cy="100" r="4" fill="none" stroke="#FF0000" stroke-width="0.5" opacity="0.3" />

    <circle cx="380" cy="200" r="2" fill="#FF0000" />
    <circle cx="380" cy="200" r="4" fill="none" stroke="#FF0000" stroke-width="0.5" opacity="0.3" />

    <circle cx="150" cy="300" r="2" fill="#FF0000" />
    <circle cx="150" cy="300" r="4" fill="none" stroke="#FF0000" stroke-width="0.5" opacity="0.3" />

