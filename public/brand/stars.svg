    <circle cx="260" cy="130" r="1.5" />
    <circle cx="360" cy="150" r="1.5" />

    <circle cx="70" cy="220" r="1.5" />
    <circle cx="170" cy="200" r="1.5" />
    <circle cx="270" cy="220" r="1.5" />
    <circle cx="350" cy="200" r="1.5" />

    <circle cx="40" cy="300" r="1.5" />
    <circle cx="140" cy="320" r="1.5" />
    <circle cx="240" cy="300" r="1.5" />
